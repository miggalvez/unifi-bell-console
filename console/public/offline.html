<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bells — can't reach the console</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f7f9; --fg: #101722; --muted: #5b6473; --card: #ffffff; --border: #dfe3ea; --primary: #2f6fed; }
  @media (prefers-color-scheme: dark) { :root { --bg: #101722; --fg: #e8ecf3; --muted: #97a1b2; --card: #182230; --border: #2b3648; --primary: #4d84f0; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 24px; padding-bottom: calc(24px + env(safe-area-inset-bottom)); background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 22rem; width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
  h1 { font-size: 1.125rem; margin: 0 0 8px; }
  p { margin: 0 0 16px; color: var(--muted); }
  button { width: 100%; min-height: 44px; border: 0; border-radius: 10px; background: var(--primary); color: #fff; font: inherit; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Can't reach the bell console</h1>
  <p>Your phone is not connected to the school network right now. Join the school Wi-Fi, or turn on Tailscale, then try again.</p>
  <p>Bells, announcements and alerts are unaffected — only this phone's view of them.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
